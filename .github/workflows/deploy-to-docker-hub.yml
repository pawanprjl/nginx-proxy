name: Docker Image CI

on:
  push:
    branches:
      - 'main'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base_changed: ${{ steps.filter.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            base:
              - 'docker/python-nginx-alpine.Dockerfile'
              - 'docker/nginx.conf'

  python-nginx:
    if: needs.changes.outputs.base_changed == 'true'
    runs-on: ubuntu-latest
    needs: [changes]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: pawanprjl
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          file: docker/python-nginx-alpine.Dockerfile
          context: docker
          push: true
          platforms: linux/amd64, linux/arm64
          tags: pawanprjl/python-nginx:latest

  nginx-proxy:
    runs-on: ubuntu-latest
    needs: [python-nginx]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: pawanprjl
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          file: Dockerfile
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          tags: pawanprjl/nginx-proxy:latest
